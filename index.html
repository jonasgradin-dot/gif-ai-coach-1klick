<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GIF Coach" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Båstads GIF – Din coachkompis</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" style="display:none;max-width:480px;margin:0 auto;padding:20px;font-family:system-ui,sans-serif;background:#fff;min-height:100vh">
      <h1 style="font-size:22px">Appen kunde inte starta</h1>
      <p>Det kan bero på en gammal sparad version. Rensa cachen så hämtas den senaste.</p>
      <button id="bf-clear" style="display:block;width:100%;padding:14px;border-radius:12px;border:1px solid #6fb066;background:#a9d8a0;font-size:16px;font-weight:600">Rensa cache och försök igen</button>
      <pre id="bf-err" style="white-space:pre-wrap;font-size:12px;color:#666"></pre>
    </div>
    <script>
      (function () {
        var errs = [];
        addEventListener('error', function (e) { errs.push(e.message || 'okänt fel'); });
        addEventListener('unhandledrejection', function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
        document.getElementById('bf-clear').onclick = function () {
          var done = function () { location.reload(); };
          Promise.resolve()
            .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0; })
            .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; })
            .then(done, done);
        };
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && !r.firstChild) {
            document.getElementById('boot-fallback').style.display = 'block';
            document.getElementById('bf-err').textContent = errs.slice(0, 3).join('\n');
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
